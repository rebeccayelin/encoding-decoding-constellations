<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Encoding-Decoding Constellations">
  <rect width="32" height="32" rx="6" fill="#f6f3ed"/>
  <g transform="translate(16 16)" fill="none" stroke="#8a6f32" stroke-width="1.3" stroke-linejoin="round">
    <!-- eight-point constellation rosette: two overlaid squares plus a circle packing ring -->
    <rect x="-7.5" y="-7.5" width="15" height="15"/>
    <rect x="-7.5" y="-7.5" width="15" height="15" transform="rotate(45)"/>
    <circle r="10.6" stroke-width="1"/>
  </g>
  <g fill="#8a6f32">
    <circle cx="16" cy="16" r="1.5"/>
  </g>
</svg>
